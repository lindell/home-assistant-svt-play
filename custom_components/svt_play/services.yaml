        entity:
          domain: media_player
    program_name:
      required: true
      example: "rapport"
      selector:
        text:
play_latest:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    program_name:
      required: true
      example: "rapport"
      selector:
        text:
    category:
      example: "Klipp"
      selector:
        text:
    exclude_category:
      example: "utan filmer"
      selector:
        text:
play_random:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    program_name:
      required: true
      example: "rapport"
      selector:
        text:
    category:
      example: "Klipp"
      selector:
        text:
play_channel:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    channel:
      required: true
      example: "svt1"
      selector:
        select:
          options:
            - "svt1"
            - "svt2"
            - "barnkanalen"
            - "kunskapskanalen"
            - "svt24"
          custom_value: true
play_videoid:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    videoid:
      required: true
      example: "jXvZLoG"
      selector:
        text:
