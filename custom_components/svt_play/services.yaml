play_channel:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    channel:
      required: true
      example: "svt1"
      selector:
        select:
          options:
            - "svt1"
            - "svt2"
            - "barnkanalen"
            - "kunskapskanalen"
            - "svt24"
          custom_value: true
    formats:
      example: ["hls", "dash"]
