play_suggested:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    program_name:
      required: true
      example: "rapport"
      selector:
        text:
    formats:
      example: ["hls", "dash"]
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - "hls"
            - "dash"
            - "dash-full"
            - "hls-cmaf-full"
            - "dash-lb-full"
            - "dash-hbbtv-avc"
            - "hls-ts-full"
            - "dash-avc"
            - "hls-cmaf-lb-full"
            - "hls-cmaf-avc"
            - "hls-ts-lb-full"
            - "dash-hbbtv-hevc"
